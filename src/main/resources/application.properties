spring.application.name=banquito-switch-batch-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SWITCH_LOTES_DB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/init/001_create_batch_tables.sql

core.kong.base-url=${CORE_API_GATEWAY_BASE_URL:${CORE_KONG_BASE_URL:http://localhost:8000}}
core.kong.switch-core-path=${CORE_API_GATEWAY_SWITCH_CORE_PATH:${CORE_KONG_SWITCH_CORE_PATH:/api/v1/switch-core}}
core.kong.payment-reservations-path=${CORE_API_GATEWAY_PAYMENT_RESERVATIONS_PATH:${CORE_KONG_PAYMENT_RESERVATIONS_PATH:/payment-reservations}}
core.kong.customers-by-identification-path=${CORE_API_GATEWAY_CUSTOMERS_BY_IDENTIFICATION_PATH:${CORE_KONG_CUSTOMERS_BY_IDENTIFICATION_PATH:/api/v1/customers/by-identification/{identification}}}
core.kong.account-by-number-path=${CORE_API_GATEWAY_ACCOUNT_BY_NUMBER_PATH:${CORE_KONG_ACCOUNT_BY_NUMBER_PATH:/api/v1/accounts/{accountNumber}}}
core.kong.company-account-validation-path=${CORE_API_GATEWAY_COMPANY_ACCOUNT_VALIDATION_PATH:${CORE_KONG_COMPANY_ACCOUNT_VALIDATION_PATH:/api/v1/switch-core/company-account-validation}}
core.kong.auth-token=${CORE_API_GATEWAY_AUTH_TOKEN:${CORE_KONG_AUTH_TOKEN:}}
core.kong.client-token.enabled=${CORE_API_GATEWAY_CLIENT_TOKEN_ENABLED:${CORE_KONG_CLIENT_TOKEN_ENABLED:true}}
core.kong.client-id=${CORE_API_GATEWAY_CLIENT_ID:${CORE_KONG_CLIENT_ID:switch-pagos-internos-service}}
core.kong.client-secret=${CORE_API_GATEWAY_CLIENT_SECRET:${CORE_KONG_CLIENT_SECRET:}}
core.kong.required-scope=${CORE_API_GATEWAY_REQUIRED_SCOPE:${CORE_KONG_REQUIRED_SCOPE:core.reserve.consume}}
core.kong.customer-required-scope=${CORE_API_GATEWAY_CUSTOMER_REQUIRED_SCOPE:${CORE_KONG_CUSTOMER_REQUIRED_SCOPE:${CORE_API_GATEWAY_REQUIRED_SCOPE:${CORE_KONG_REQUIRED_SCOPE:customer.read}}}}
core.kong.account-required-scope=${CORE_API_GATEWAY_ACCOUNT_REQUIRED_SCOPE:${CORE_KONG_ACCOUNT_REQUIRED_SCOPE:${CORE_API_GATEWAY_REQUIRED_SCOPE:${CORE_KONG_REQUIRED_SCOPE:account.read}}}}
core.kong.company-account-validation-required-scope=${CORE_API_GATEWAY_COMPANY_ACCOUNT_VALIDATION_REQUIRED_SCOPE:${CORE_KONG_COMPANY_ACCOUNT_VALIDATION_REQUIRED_SCOPE:${CORE_API_GATEWAY_RESERVATION_CREATE_REQUIRED_SCOPE:${CORE_KONG_RESERVATION_CREATE_REQUIRED_SCOPE:core.reserve.create}}}}
core.kong.reservation-create-required-scope=${CORE_API_GATEWAY_RESERVATION_CREATE_REQUIRED_SCOPE:${CORE_KONG_RESERVATION_CREATE_REQUIRED_SCOPE:${CORE_API_GATEWAY_REQUIRED_SCOPE:${CORE_KONG_REQUIRED_SCOPE:core.reserve.create}}}}
core.kong.client-token-path=${CORE_API_GATEWAY_CLIENT_TOKEN_PATH:${CORE_KONG_CLIENT_TOKEN_PATH:/api/v1/auth/client-token}}
core.kong.client-token-refresh-skew-seconds=${CORE_API_GATEWAY_CLIENT_TOKEN_REFRESH_SKEW_SECONDS:${CORE_KONG_CLIENT_TOKEN_REFRESH_SKEW_SECONDS:60}}
core.kong.connect-timeout-ms=${CORE_API_GATEWAY_CONNECT_TIMEOUT_MS:${CORE_KONG_CONNECT_TIMEOUT_MS:5000}}
core.kong.read-timeout-ms=${CORE_API_GATEWAY_READ_TIMEOUT_MS:${CORE_KONG_READ_TIMEOUT_MS:30000}}
core.switch.default-accounting-date=${CORE_SWITCH_DEFAULT_ACCOUNTING_DATE:}
core.switch.channel=${CORE_SWITCH_CHANNEL:SWITCH_API}

grpc.server.port=${GRPC_SERVER_PORT:9091}

switch.files.output-directory=${SWITCH_FILES_OUTPUT_DIRECTORY:/app/output}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

messaging.provider=${MESSAGING_PROVIDER:pubsub}
pubsub.enabled=${PUBSUB_ENABLED:true}
pubsub.project-id=${GOOGLE_CLOUD_PROJECT:}
pubsub.schema-version=${PUBSUB_SCHEMA_VERSION:1}
pubsub.topic.payment-lines=${PUBSUB_TOPIC_PAYMENT_LINES:switch-payment-lines}
pubsub.subscription.batch-billing-completed=${PUBSUB_SUB_BATCH_BILLING_COMPLETED:switch-batch-billing-completed-sub}
